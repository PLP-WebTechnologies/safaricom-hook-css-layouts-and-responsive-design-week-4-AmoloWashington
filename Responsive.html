<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Web Design</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #333;
            color: #fff;
            padding: 1rem;
        }

        header .logo {
            font-size: 1.5rem;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 1rem;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #00f;
        }

        main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            padding: 2rem;
            flex: 1;
        }

        main .text {
            font-size: 1.2rem;
        }

        main .image {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        main .image img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
        }

        footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 1rem;
        }

        footer .social-links {
            margin-bottom: 0.5rem;
        }

        footer .social-links a {
            color: #fff;
            margin: 0 0.5rem;
            text-decoration: none;
        }

        footer .social-links a:hover {
            color: #00f;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                align-items: flex-start;
            }

            main {
                grid-template-columns: 1fr;
            }
        }

        @media (min-width: 601px) and (max-width: 1024px) {
            main {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="vecteezy_hacker-mascot-for-sports-and-esports-logo_5076592.jpg">My Logo</div>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="text">
            <h1>Welcome to My Website</h1>
            <p>This is my responsive website having employed the knowledge learnt from the class.</p>
        </div>
        <div class="image">
            <img src="pexels-mccutcheon-1148998.jpg" alt="Sample Image">
        </div>
    </main>
    <footer>
        <div class="social-links">
            <a href="#">Facebook</a>
            <a href="#">Twitter</a>
            <a href="#">Instagram</a>
        </div>
        <p>&copy; 2025 My Website. All rights reserved.</p>
    </footer>
</body>
</html>
